name: "CLA Assistant"

# Contributors sign the CLA by commenting on their PR. Signatures are recorded
# in signatures/version1/cla.json on the default branch. See CLA.md.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target runs in the base-repo context so the action can post the
# CLA status on PRs from forks. This workflow never checks out PR code, so that
# is safe here.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          branch: "main"
          # Skip the CLA for the maintainer and bots (comma-separated, globs ok).
          allowlist: jimmyasyraf,dependabot[bot],github-actions[bot]
          # The phrase a contributor must comment to sign:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
