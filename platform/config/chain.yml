# Non-secret per-network chain parameters. Keys live in encrypted credentials
# (credentials.chain.oracle_key / relayer_key), never here. Addresses are set
# after deploying the escrow to each network; override via env in deployed envs.
#
# USDC: Base Sepolia is Circle's testnet USDC (B.1). Base mainnet must be
# verified against Circle's docs before launch — native USDC, never USDbC.

# Defaults to local anvil; point at Base Sepolia by setting CHAIN_NETWORK=base_sepolia
# (plus CHAIN_ID/CHAIN_RPC_URL/USDC_ADDRESS/ESCROW_ADDRESS/… ) without changing code.
development:
  network: <%= ENV.fetch("CHAIN_NETWORK", "anvil") %>
  chain_id: <%= ENV.fetch("CHAIN_ID", 31337) %>
  rpc_url: <%= ENV.fetch("CHAIN_RPC_URL", "http://127.0.0.1:8545") %>
  # Addresses MUST be quoted — unquoted 0x… is parsed by YAML as a hex integer.
  usdc_address: "<%= ENV.fetch("USDC_ADDRESS", "0x0000000000000000000000000000000000000000") %>"
  escrow_address: "<%= ENV.fetch("ESCROW_ADDRESS", "0x0000000000000000000000000000000000000000") %>"
  usdc_permit_version: "<%= ENV.fetch("USDC_PERMIT_VERSION", "1") %>"   # anvil MockUSDC = "1"; Base USDC = "2"
  # Browser-safe RPC + label for the funding controller's network switch/add.
  public_rpc_url: "<%= ENV.fetch("PUBLIC_RPC_URL", "http://127.0.0.1:8545") %>"
  chain_label: "<%= ENV.fetch("CHAIN_LABEL", "Anvil (local)") %>"
  confirmations: <%= ENV.fetch("CHAIN_CONFIRMATIONS", 0) %>
  start_block: <%= ENV.fetch("CHAIN_START_BLOCK", 0) %>   # escrow deploy block; 0 = anvil genesis

test:
  network: anvil
  chain_id: 31337
  rpc_url: http://127.0.0.1:8545
  usdc_address: "0x0000000000000000000000000000000000000000"
  escrow_address: "0x0000000000000000000000000000000000000000"
  usdc_permit_version: "1"
  public_rpc_url: "http://127.0.0.1:8545"
  chain_label: "Anvil (local)"
  confirmations: 0

production:
  network: <%= ENV.fetch("CHAIN_NETWORK", "base_sepolia") %>
  chain_id: <%= ENV.fetch("CHAIN_ID", 84532) %>
  rpc_url: <%= ENV.fetch("CHAIN_RPC_URL", "https://sepolia.base.org") %>
  usdc_address: "<%= ENV.fetch("USDC_ADDRESS", "0x036CbD53842c5426634e7929541eC2318f3dCF7e") %>"
  escrow_address: "<%= ENV.fetch("ESCROW_ADDRESS", "") %>"
  usdc_permit_version: "<%= ENV.fetch("USDC_PERMIT_VERSION", "2") %>"  # Circle USDC permit domain version
  # Browser-safe public RPC for wallet network-add (NOT the server's possibly-authenticated rpc_url).
  public_rpc_url: "<%= ENV.fetch("PUBLIC_RPC_URL", "https://sepolia.base.org") %>"
  chain_label: "<%= ENV.fetch("CHAIN_LABEL", "Base Sepolia") %>"
  confirmations: <%= ENV.fetch("CHAIN_CONFIRMATIONS", 2) %>
  start_block: <%= ENV.fetch("CHAIN_START_BLOCK", 0) %>   # set to the escrow's deploy block
